<html>
<head>
<title>Continental Hotel Reservation Form</title>
<style>
 body {
       background-color: lightgray;
      }
 h1 {
      color: red;
      text-align: center;
     }
 table {
         background-color: lightblue;
         border: 1px solid black;
         width: 600px;
         margin:auto;
        }

  th, td {
           border: 1px solid black;
           padding: 8px;
        }
 </style>
 </head>
 <body>
 <h1>Continental Hotel Reservation Form</h1>
 <form>
 <table>
 <tr>
 <th>Name</th>
 <td><input type="text" name="name"
 placeholder="Enter your name"value="M.Abdullah"></td>
 </tr>
 <tr>
 <th>eMail</th>
 <td><input type="email" name="email"
 value="info@continental.pk"></td>
 </tr>
 <tr>
 <th>Mobile No</th>
 <td><input type="text" name="mobile"
 placeholder="Enter your cell number"value="03414266216"></td>
 </tr>
 <tr>
 <th>Arrival Time</th>
 <td><input type="text" name="arrival"></td>
 </tr>
 <tr>
 <th>Departure</th>
 <td><input type="text" name="departure"></td>
 </tr>
 <tr>
 <th>Room Type</th>
 <td>
 <input type="radio" name="room" value="single">Single
 <input type="radio" name="room" value="double">Double
 <br>
 <input type="radio" name="room" value="suite">
 Presidential Suite
 </td>
 </tr>
 <tr>
 <th>Preferences</th>
 <td>
 <input type="checkbox" name="preferences"
 value="non-smoking">Non-Smoking
 <br>
 <input type="checkbox" name="preferences"
 value="internet">Internet
 <br>
 <input type="checkbox" name="preferences"
 value="firm-mattress">Firm Mattress
 </td>
 </tr>
 <tr>
 <th>Mode of Payment</th>
 <td>
 <input type="checkbox" name="payment"
 value="cash">Cash
 <input type="checkbox" name="payment"
 value="check">Check
 <br>
 <input type="checkbox" name="payment"
 value="credit-card">Credit Card
 <select name="card">
 <option>Select Card</option>
 <option>Visa</option>
 <option>Mastercard</option>
 </select>
 </td>
 </tr>
 <tr>
 <td colspan="2" align="center">
 <input type="submit" value="Send Data">
 <input type="reset" value="Reset">
 </td>
 </tr>
 </table>
 </form>
 </body>
 </html>
